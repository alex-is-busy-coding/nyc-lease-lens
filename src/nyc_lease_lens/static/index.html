<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NYC Lease Lens</title>
        <link rel="icon" href="/static/assets/favicon.ico" sizes="16x16 32x32" />
        <link rel="stylesheet" href="/static/app.css" />
        <!-- Markdown rendering for answers, pinned and integrity-checked. app.js falls back to plain text without them. -->
        <script
            src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"
            integrity="sha384-2vpGtuKqJvFlwJqYnf/wUMuzUfhUnYBt9oay0e2yaFcq0Dh6/aEbQ8YAOeKGzlYo"
            crossorigin="anonymous"
            defer
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"
            integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL"
            crossorigin="anonymous"
            defer
        ></script>
        <script src="/static/app.js" defer></script>
    </head>
    <body>
        <div id="container">
            <header id="header">
                <img src="/static/assets/logo.jpeg" alt="NYC Lease Lens" />
            </header>
            <div id="messages"></div>
            <div id="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Paste an NYC address, e.g. 157 Ludlow St, Manhattan"
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
                <button id="clear-btn" class="secondary" title="Start a new conversation">Clear</button>
            </div>
        </div>
        <template id="welcome">
            <div class="msg assistant welcome">
                <div class="role">assistant</div>
                <div class="content">
                    <h2>Welcome to NYC Lease Lens</h2>
                    <p>
                        Thinking of renting in New York City? Give me the building's address and I'll check the
                        city's public records for red flags before you sign the lease.
                    </p>
                    <div>
                        <p><strong>What I check</strong></p>
                        <ul>
                            <li>Housing code violations, especially hazardous ones like no heat, mold, pests or lead paint</li>
                            <li>311 complaints, compared with nearby buildings</li>
                            <li>The landlord's track record across their other buildings</li>
                            <li>Evictions, harassment cases, bedbug reports and vacate orders</li>
                        </ul>
                    </div>
                    <p>
                        <strong>What you get:</strong> a grade from A (no red flags) to F, the reasons behind it, and
                        any good signs. A check takes up to a minute. Afterwards, ask follow-up questions such as
                        "What are the open violations?" or "Who manages this building?"
                    </p>
                    <div class="examples">
                        <span>Try an example:</span>
                        <button class="secondary" data-address="157 Ludlow St, Manhattan">157 Ludlow St, Manhattan</button>
                        <button class="secondary" data-address="760 Eldert Lane, Brooklyn">760 Eldert Lane, Brooklyn</button>
                    </div>
                    <p class="fine-print">
                        Based on NYC Open Data, which can be weeks behind. This is information, not legal advice.
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
