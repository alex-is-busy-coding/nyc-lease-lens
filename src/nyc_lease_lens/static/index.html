<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NYC Lease Lens</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, sans-serif;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 3rem 1rem;
            }
            #container {
                width: 100%;
                max-width: 900px;
                display: flex;
                flex-direction: column;
                border: 1px solid #e0e0e0;
            }
            #header {
                display: flex;
                justify-content: center;
                padding: 1rem;
                border-bottom: 1px solid #e0e0e0;
            }
            #header img {
                height: 120px;
                width: auto;
                max-width: 100%;
                object-fit: contain;
            }
            #messages {
                overflow-y: auto;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                min-height: 400px;
                max-height: 60vh;
            }
            .msg {
                line-height: 1.5;
                max-width: 80%;
            }
            .msg.user {
                align-self: flex-end;
                text-align: right;
            }
            .msg .role {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #999;
                margin-bottom: 0.25rem;
            }
            .msg.loading .content {
                color: #999;
            }
            #input-area {
                display: flex;
                gap: 1rem;
                padding: 1.5rem;
                border-top: 1px solid #e0e0e0;
            }
            #user-input {
                flex: 1;
                padding: 0.75rem 0;
                border: none;
                border-bottom: 1px solid #e0e0e0;
                font-size: 1rem;
                outline: none;
            }
            #user-input:focus {
                border-bottom-color: #000;
            }
            button {
                padding: 0.75rem 1.5rem;
                background: #000;
                color: #fff;
                border: none;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                cursor: pointer;
            }
            .tool {
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #555;
                background: #f5f5f5;
                border-left: 3px solid #f59e0b;
                padding: 0.5rem 0.75rem;
                margin: 0.25rem 0 0.75rem;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .tool .label {
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #b45309;
            }
            button.secondary {
                background: #fff;
                color: #000;
                border: 1px solid #000;
            }
            .welcome .content {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
            }
            .welcome h2 {
                font-size: 1.1rem;
            }
            .welcome ul {
                padding-left: 1.25rem;
            }
            .welcome .examples {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                align-items: center;
            }
            .welcome .examples button {
                padding: 0.4rem 0.75rem;
                text-transform: none;
                letter-spacing: normal;
                font-size: 0.85rem;
            }
            .welcome .fine-print {
                font-size: 0.75rem;
                color: #999;
            }
            @media (max-width: 600px) {
                #messages {
                    padding: 1.25rem;
                }
                .msg {
                    max-width: 100%;
                }
                #input-area {
                    flex-wrap: wrap;
                }
                #user-input {
                    flex-basis: 100%;
                }
                #input-area > button {
                    flex: 1;
                }
            }
            button:disabled {
                opacity: 0.3;
                cursor: default;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <header id="header">
                <img src="/static/nyc_lease_lens_logo.jpeg" alt="NYC Lease Lens" />
            </header>
            <div id="messages"></div>
            <div id="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Paste an NYC address, e.g. 157 Ludlow St, Manhattan"
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
                <button id="clear-btn" class="secondary" title="Start a new conversation">Clear</button>
            </div>
        </div>
        <template id="welcome">
            <div class="msg assistant welcome">
                <div class="role">assistant</div>
                <div class="content">
                    <h2>Welcome to NYC Lease Lens</h2>
                    <p>
                        Thinking of renting in New York City? Give me the building's address and I'll check the
                        city's public records for red flags before you sign the lease.
                    </p>
                    <div>
                        <p><strong>What I check</strong></p>
                        <ul>
                            <li>Housing code violations, especially hazardous ones like no heat, mold, pests or lead paint</li>
                            <li>311 complaints, compared with nearby buildings</li>
                            <li>The landlord's track record across their other buildings</li>
                            <li>Evictions, harassment cases, bedbug reports and vacate orders</li>
                        </ul>
                    </div>
                    <p>
                        <strong>What you get:</strong> a grade from A (no red flags) to F, the reasons behind it, and
                        any good signs. A check takes up to a minute. Afterwards, ask follow-up questions such as
                        "What are the open violations?" or "Who manages this building?"
                    </p>
                    <div class="examples">
                        <span>Try an example:</span>
                        <button class="secondary" data-address="157 Ludlow St, Manhattan">157 Ludlow St, Manhattan</button>
                        <button class="secondary" data-address="760 Eldert Lane, Brooklyn">760 Eldert Lane, Brooklyn</button>
                    </div>
                    <p class="fine-print">
                        Based on NYC Open Data, which can be weeks behind. This is information, not legal advice.
                    </p>
                </div>
            </div>
        </template>
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const clearBtn = document.getElementById("clear-btn");
            let sessionId = null;
            let busy = false;

            // Clearing mid-request would let the late reply restore the old session.
            function setBusy(value) {
                busy = value;
                sendBtn.disabled = value;
                clearBtn.disabled = value;
            }

            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className =
                    "msg " +
                    (role === "you" ? "user" : "assistant") +
                    (isLoading ? " loading" : "");
                div.innerHTML =
                    '<div class="role">' +
                    role +
                    '</div><div class="content">' +
                    text +
                    "</div>";
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            async function send() {
                const text = userInput.value.trim();
                if (!text || busy) return;

                userInput.value = "";
                setBusy(true);
                addMessage("you", text);
                const loading = addMessage(
                    "assistant",
                    "Checking city records… this can take up to a minute.",
                    true,
                );

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId,
                        }),
                    });
                    const data = await res.json();
                    sessionId = data.session_id;

                    // Show each tool the harness ran, above the assistant's answer
                    for (const call of data.tool_calls || []) {
                        const div = document.createElement("div");
                        div.className = "tool";
                        const label = document.createElement("span");
                        label.className = "label";
                        label.textContent = "tool call  ";
                        div.appendChild(label);
                        div.appendChild(
                            document.createTextNode(
                                call.name + "(" + JSON.stringify(call.args) + ")\n→ " + call.result,
                            ),
                        );
                        messages.insertBefore(div, loading);
                    }
                    loading.querySelector(".content").textContent =
                        data.response;
                    loading.classList.remove("loading");
                } catch (e) {
                    loading.querySelector(".content").textContent =
                        "Error: " + e.message;
                    loading.classList.remove("loading");
                }
                setBusy(false);
                userInput.focus();
            }

            async function clearChat() {
                if (busy) return;
                const previous = sessionId;
                sessionId = null;
                messages.replaceChildren();
                showWelcome();
                userInput.value = "";
                userInput.focus();
                if (!previous) return;
                try {
                    await fetch("/clear?session_id=" + encodeURIComponent(previous), { method: "POST" });
                } catch (e) {
                    // The screen is already cleared and the next message starts a new session.
                    console.warn("Could not clear the session on the server:", e);
                }
            }

            // Shown on load and after Clear. Rendered here, not by the model, so it's instant and free.
            function showWelcome() {
                const welcome = document.getElementById("welcome").content.cloneNode(true);
                for (const button of welcome.querySelectorAll("[data-address]")) {
                    button.addEventListener("click", function () {
                        userInput.value = "Check " + button.dataset.address;
                        send();
                    });
                }
                messages.appendChild(welcome);
            }

            sendBtn.addEventListener("click", send);
            clearBtn.addEventListener("click", clearChat);
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") send();
            });
            showWelcome();
            userInput.focus();
        </script>
    </body>
</html>
