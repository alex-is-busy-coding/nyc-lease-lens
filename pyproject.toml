[project]
name = "nyc-lease-lens"
version = "0.1.0"
description = "An AI agent that checks any NYC apartment for red flags before you sign the lease"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
nyc-lease-lens = "nyc_lease_lens.__main__:main"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The build packages files on disk, not just tracked ones; keep OS clutter out.
source-exclude = ["**/.DS_Store"]
wheel-exclude = ["**/.DS_Store"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "time-machine>=3.5.1",
    "types-requests>=2.33.0.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, no print(), logging call style
select = ["E", "F", "I", "B", "UP", "SIM", "T20", "G", "LOG"]

[tool.mypy]
python_version = "3.13"
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",  # a new warning fails the tests, so it gets fixed rather than ignored
    # Raised inside Starlette's TestClient itself, not our code; remove once Starlette updates.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
