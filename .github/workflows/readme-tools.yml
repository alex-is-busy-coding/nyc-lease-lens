name: Update README tools table

on:
  push:
    branches: ["**"]
    paths:
      - "src/nyc_lease_lens/tools/**"
      - "scripts/update_readme_tools.py"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Regenerate tools table
        run: uv run python scripts/update_readme_tools.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README.md already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(readme): update tools table" README.md
          git push origin "HEAD:${GITHUB_REF_NAME}"
