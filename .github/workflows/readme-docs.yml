name: Update README tables

on:
  push:
    branches: ["**"]
    paths:
      - "makefile"
      - "src/nyc_lease_lens/tools/**"
      - "scripts/update_readme.py"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Regenerate README tables
        run: uv run python scripts/update_readme.py

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README.md already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(readme): update generated tables" README.md
          git push origin "HEAD:${GITHUB_REF_NAME}"
